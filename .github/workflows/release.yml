name: release

# A tag v* builds aitrium with everything it runs (scripts/package.sh, the parts at the
# commits dist/PARTS names) for each platform, and publishes the archives install.sh
# fetches. Run by hand, it builds them without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on Debian bullseye (glibc 2.31), so the archive starts on every newer libc.
          - { target: linux-x86_64, runner: ubuntu-24.04, container: 'rust:1-bullseye' }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, container: 'rust:1-bullseye' }
          - { target: darwin-arm64, runner: macos-15, container: '' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - run: scripts/package.sh dist/out
      - name: Starts on its own
        run: |
          mkdir -p /tmp/try && AITRIUM_ARCHIVE="dist/out/aitrium-${{ matrix.target }}.tar.gz" AITRIUM_PREFIX=/tmp/try sh install.sh
          /tmp/try/bin/aitrium --help | head -1
          /tmp/try/share/aitrium/comide --help > /dev/null
          /tmp/try/share/aitrium/golemide --version
          /tmp/try/share/aitrium/porta --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aitrium-${{ matrix.target }}
          path: dist/out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
